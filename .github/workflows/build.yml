name: Build OneJar

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Verify reactor
    # GitHub withholds package credentials from fork pull requests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, instanto-container]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify reactor
        run: ./mvnw --settings .github/maven-settings.xml --batch-mode --no-transfer-progress clean verify
        env:
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}

      - name: SonarQube Quality Gate
        if: env.SONAR_TOKEN != ''
        run: |
          set -euo pipefail
          repo_name="${GITHUB_REPOSITORY#*/}"
          ./mvnw --settings .github/maven-settings.xml --batch-mode --no-transfer-progress \
            sonar:sonar \
            -Dsonar.projectKey="$repo_name" \
            -Dsonar.projectName="$repo_name" \
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.instanto.io

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onejar-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Publish Maven snapshot to packages.instanto.io
        if: github.event_name != 'pull_request'
        run: >-
          ./mvnw --settings .github/maven-settings.xml --batch-mode --no-transfer-progress --errors --fail-at-end
          -DskipTests
          deploy
        env:
          FORGEJO_PACKAGE_USER: ${{ secrets.FORGEJO_PACKAGE_USER }}
          FORGEJO_PACKAGE_TOKEN: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
